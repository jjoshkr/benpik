# TOPIK II 읽기 일일 학습 메일 (PRD v0.3, FR-7)
#
# 목표 발송 시각: 매일 08:45 KST.
# GitHub Actions cron 은 5~20분가량 지연되는 것이 보통이므로(FR-7 흡수분),
# 08:30 KST(= 23:30 UTC 전날)에 걸어 실제 발송이 08:45 전후에 떨어지게 한다.
#
# 필요한 Secrets (NFR-6 — 코드·로그에 노출 금지):
#   ANTHROPIC_API_KEY  LLM 생성
#   SMTP_USER          발신 계정 (예: Gmail 주소)
#   SMTP_PASS          앱 비밀번호
#
# 주의: 60일간 커밋이 없으면 GitHub 가 스케줄을 자동 정지한다(§11).

name: topik-daily

on:
  schedule:
    - cron: "30 23 * * *" # 08:30 KST + cron 지연 → 08:45 전후 발송
  workflow_dispatch:
    inputs:
      dry_run:
        description: "발송 없이 생성 결과만 출력"
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # NFR-1: 외부 패키지 0개 — pip install 불필요
      - name: Generate & send
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TOPIK_TO: benrico@handong.ac.kr
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m topik_daily --dry-run
          else
            python -m topik_daily
          fi
